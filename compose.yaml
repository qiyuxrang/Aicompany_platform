name: enterprise-portal-phase1

services:
  db:
    image: postgres:17.11@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
    env_file:
      - ${DB_ENV_FILE:-.runtime/postgres.env}
    volumes:
      - phase1_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORTAL_DEBUG: "0"
      PORTAL_HTTPS: "1"
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "5432"
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORTAL_DEBUG: "0"
      PORTAL_HTTPS: "1"
      PORTAL_BEHIND_PROXY: "1"
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "5432"
      PORTAL_HR_STORAGE_ROOT: /app/.runtime/hr-private
      PORTAL_ENGINEERING_STORAGE_ROOT: /app/.runtime/engineering-private
    command:
      - sh
      - -ceu
      - |
        exec waitress-serve \
          --listen=0.0.0.0:8100 \
          --threads=4 \
          --connection-limit=512 \
          --asyncore-use-poll \
          --trusted-proxy="$${WAITRESS_TRUSTED_PROXY:-*}" \
          --trusted-proxy-count=1 \
          --trusted-proxy-headers="x-forwarded-proto x-forwarded-for" \
          --clear-untrusted-proxy-headers \
          config.wsgi:application
    volumes:
      - product_private_data:/app/.runtime/product-private
      - hr_private_data:/app/.runtime/hr-private
      - tender_private_data:/app/.runtime/tender-private
      - engineering_private_data:/app/.runtime/engineering-private
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8100}:8100"
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, os;
          host=(os.environ.get('PORTAL_ALLOWED_HOSTS') or '127.0.0.1').split(',')[0].strip();
          connection=http.client.HTTPConnection('127.0.0.1', 8100, timeout=3);
          connection.request('GET', '/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https', 'X-Forwarded-For': '127.0.0.1'});
          response=connection.getresponse();
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  hr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORTAL_DEBUG: "0"
      PORTAL_HTTPS: "1"
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "5432"
      PORTAL_HR_STORAGE_ROOT: /app/.runtime/hr-private
    command: [python, manage.py, run_hr_worker, --concurrency, "1"]
    volumes:
      - hr_private_data:/app/.runtime/hr-private
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 180s

  product-worker:
    profiles: [product]
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORTAL_DEBUG: "0"
      PORTAL_HTTPS: "1"
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "5432"
    command: [python, manage.py, run_product_worker]
    volumes:
      - product_private_data:/app/.runtime/product-private
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 180s

  tender-consumer:
    profiles: [tender]
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORTAL_DEBUG: "0"
      PORTAL_HTTPS: "1"
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "5432"
      PORTAL_TENDER_STORAGE_ROOT: /app/.runtime/tender-private
    command: [python, manage.py, run_tender_consumer]
    volumes:
      - tender_private_data:/app/.runtime/tender-private
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 180s

  engineering-worker:
    profiles: [engineering]
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORTAL_DEBUG: "0"
      PORTAL_HTTPS: "1"
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "5432"
      PORTAL_ENGINEERING_STORAGE_ROOT: /app/.runtime/engineering-private
    command: [python, manage.py, run_engineering_worker]
    volumes:
      - engineering_private_data:/app/.runtime/engineering-private
      # An independently supplied image/runtime and trusted absolute CLI are
      # required; this platform does not manufacture a cost calculation CLI.
      - type: bind
        source: ${ENGINEERING_RUNTIME_DIR:-./.runtime/engineering-runtime}
        target: /opt/engineering
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 180s

  model-gateway:
    profiles: [models]
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-portal-phase1:local
    working_dir: /app
    env_file:
      - ${MODEL_GATEWAY_ENV_FILE:-.runtime/model-gateway.env}
    command: [python, -m, uvicorn, model_gateway.app:app, --host, 0.0.0.0, --port, "18410", --workers, "1", --limit-concurrency, "16", --timeout-keep-alive, "5", --no-access-log]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18410/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    restart: unless-stopped
    stop_grace_period: 70s

volumes:
  phase1_pg_data:
  product_private_data:
  hr_private_data:
  tender_private_data:
  engineering_private_data:
