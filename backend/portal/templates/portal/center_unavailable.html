<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台暂不可访问</title>
  <style>
    body { margin: 0; padding: 24px; background: #f5f7fb; color: #20334a; font-family: system-ui, sans-serif; }
    main { max-width: 560px; margin: 12vh auto; padding: 32px; border: 1px solid #dce4ee; border-radius: 16px; background: white; }
    h1 { font-size: 24px; margin: 0 0 20px; }
    p { line-height: 1.8; color: #56687f; }
    a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 8px; background: #245fb6; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #84b2ed; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>工作台暂不可访问</h1>
    <p>当前账号未获得此工作台的访问权限，或该入口已停用。</p>
    <p>平台管理权限不等于业务权限。请返回工作台退出当前账号，再使用已授权的业务账号登录；如需开通权限，请联系管理员。</p>
    <a href="/">返回我的工作台</a>
  </main>
</body>
</html>
