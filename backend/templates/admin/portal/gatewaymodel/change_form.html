{% extends "admin/change_form.html" %}

{% block content %}
{{ block.super }}
{% if can_test_connection %}
<section class="module aligned" aria-label="模型连接测试">
  <h2>测试已保存的模型配置</h2>
  <p>仅支持 OpenAI Chat 兼容接口，不代表支持所有厂商。测试使用已保存配置和固定短测试文本，不发送本页未保存内容，不展示模型输出。</p>
  <form method="post" action="{{ test_connection_url }}">
    {% csrf_token %}
    <p><label><input type="checkbox" name="confirm_cost" value="on" required> 我确认测试可能产生费用，且仅发送固定短测试文本。</label></p>
    <button type="submit">测试连接</button>
  </form>
</section>
{% endif %}
{% endblock %}
